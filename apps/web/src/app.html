<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#030711" />
    <script>
      (() => {
        const storageKey = "prisma-theme";
        const pathname = window.location.pathname.replace(/\/+$/, "") || "/";
        const isPrintRoute = pathname === "/analise/imagens/imprimir"
          || /^\/imoveis\/[^/]+\/imagens\/imprimir$/.test(pathname);
        let preference = "dark";
        try {
          const storedTheme = window.localStorage.getItem(storageKey);
          if (storedTheme === "light" || storedTheme === "dark") preference = storedTheme;
        } catch {
          // Storage can be unavailable in privacy-restricted contexts.
        }
        const theme = isPrintRoute ? "light" : preference;
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#030711" : "#f4f7fb");
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
